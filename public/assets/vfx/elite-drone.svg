<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Robust heavy evil armor plating metallic gradient -->
    <linearGradient id="eliteHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1f27"/>
      <stop offset="50%" stop-color="#28151c"/>
      <stop offset="100%" stop-color="#140b0e"/>
    </linearGradient>
    <linearGradient id="eliteInnerPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#261218"/>
      <stop offset="100%" stop-color="#0f070a"/>
    </linearGradient>
    <!-- Evil glowing red-yellow ocular sensor -->
    <radialGradient id="evilSensorEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff2a8"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="80%" stop-color="#ff2200"/>
      <stop offset="100%" stop-color="#550000"/>
    </radialGradient>
    <!-- Evil Thruster exhaust glow -->
    <linearGradient id="evilThrusterGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffbb22"/>
      <stop offset="100%" stop-color="#ff1100"/>
    </linearGradient>
  </defs>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Quad Rear Thruster Exhausts (facing upward) -->
    <polygon points="36,8 42,8 40,22 34,22" fill="url(#evilThrusterGlow)" stroke="#ff4411" stroke-width="1.5"/>
    <polygon points="46,12 52,12 50,24 44,24" fill="url(#evilThrusterGlow)" stroke="#ff7711" stroke-width="1.5"/>
    <polygon points="76,12 82,12 84,24 78,24" fill="url(#evilThrusterGlow)" stroke="#ff7711" stroke-width="1.5"/>
    <polygon points="86,8 92,8 94,22 88,22" fill="url(#evilThrusterGlow)" stroke="#ff4411" stroke-width="1.5"/>

    <!-- Outer Aggressive Spiked Wing Armor Silhouettes -->
    <path fill="url(#eliteHull)" stroke="#ff5522" stroke-width="3" d="
      M64,16
      L82,22 L108,12 L124,38 L114,64 L126,88 L116,110 L94,94 L78,114 L64,124
      L50,114 L34,94 L12,110 L2,88 L14,64 L4,38 L20,12 L46,22
      Z"/>

    <!-- Reinforced Secondary Armor Plates -->
    <path fill="url(#eliteInnerPanel)" stroke="#ffaa22" stroke-width="2" d="
      M64,26
      L80,32 L102,42 L92,62 L106,78 L90,84 L76,100 L64,106
      L52,100 L38,84 L22,78 L36,62 L26,42 L48,32
      Z"/>

    <!-- Evil Heavy Twin Plasma Cannons (facing downward) -->
    <rect x="8" y="70" width="6" height="30" rx="2" fill="#ff7722" stroke="#ffdd44" stroke-width="1.5"/>
    <rect x="114" y="70" width="6" height="30" rx="2" fill="#ff7722" stroke="#ffdd44" stroke-width="1.5"/>
    <!-- Center Support Cannons -->
    <rect x="38" y="86" width="4" height="18" rx="1" fill="#cc2211" stroke="#ff9922" stroke-width="1.2"/>
    <rect x="86" y="86" width="4" height="18" rx="1" fill="#cc2211" stroke="#ff9922" stroke-width="1.2"/>

    <!-- Central Menacing Diamond Cockpit Housing -->
    <polygon points="64,40 84,56 78,82 64,94 50,82 44,56" fill="#12060a" stroke="#ff3311" stroke-width="2.5"/>

    <!-- Evil Glowing Sensor Eye with Yellow-Red Iris -->
    <circle cx="64" cy="66" r="15" fill="url(#evilSensorEye)" stroke="#ffcc33" stroke-width="2"/>
    <circle cx="64" cy="66" r="5" fill="#ffffff" stroke="none"/>
    <circle cx="64" cy="66" r="2" fill="#ff2200" stroke="none"/>

    <!-- Threat Spine Conduit Lines -->
    <line x1="64" y1="20" x2="64" y2="38" stroke="#ff4411" stroke-width="2.4"/>
    <line x1="64" y1="96" x2="64" y2="120" stroke="#ffaa22" stroke-width="2.6"/>
    <!-- Diagonal Energy conduits -->
    <line x1="48" y1="50" x2="36" y2="60" stroke="#ff7711" stroke-width="1.5"/>
    <line x1="80" y1="50" x2="92" y2="60" stroke="#ff7711" stroke-width="1.5"/>
  </g>
</svg>
