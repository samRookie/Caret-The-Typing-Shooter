<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Armor plating metallic gradient -->
    <linearGradient id="droneHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3b4c"/>
      <stop offset="50%" stop-color="#1e2936"/>
      <stop offset="100%" stop-color="#111822"/>
    </linearGradient>
    <linearGradient id="innerPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18222d"/>
      <stop offset="100%" stop-color="#0b1017"/>
    </linearGradient>
    <!-- Central glowing optic sensor -->
    <radialGradient id="sensorEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff0bd"/>
      <stop offset="60%" stop-color="#ffb84a"/>
      <stop offset="90%" stop-color="#d65a10"/>
      <stop offset="100%" stop-color="#4a1805"/>
    </radialGradient>
    <!-- Thruster exhaust glow -->
    <linearGradient id="thrusterGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#ff3311"/>
    </linearGradient>
  </defs>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Rear Thruster Exhausts (facing upward) -->
    <polygon points="42,12 48,12 46,24 40,24" fill="url(#thrusterGlow)" stroke="#ffaa44" stroke-width="1.5"/>
    <polygon points="80,12 86,12 88,24 82,24" fill="url(#thrusterGlow)" stroke="#ffaa44" stroke-width="1.5"/>

    <!-- Main Drone Wing & Fuselage Structure -->
    <path fill="url(#droneHull)" stroke="#ffcf70" stroke-width="2.8" d="
      M64,20
      L82,24 L104,18 L116,42 L108,68 L114,92 L96,86 L80,104 L64,118
      L48,104 L32,86 L14,92 L20,68 L12,42 L24,18 L46,24
      Z"/>

    <!-- Inner Armor Wing Panels -->
    <path fill="url(#innerPanel)" stroke="#ffb84a" stroke-width="1.8" d="
      M64,30
      L80,34 L96,44 L88,64 L98,80 L82,78 L64,96
      L46,78 L30,80 L40,64 L32,44 L48,34
      Z"/>

    <!-- Twin Wingtip Weapon Emitters / Plasma Barrels (facing downward) -->
    <rect x="18" y="76" width="4" height="22" rx="2" fill="#ffb84a" stroke="#ffd980" stroke-width="1.2"/>
    <rect x="106" y="76" width="4" height="22" rx="2" fill="#ffb84a" stroke="#ffd980" stroke-width="1.2"/>

    <!-- Central Optic Sensor Cockpit Housing (Diamond/Hex Visor) -->
    <polygon points="64,44 80,58 76,78 64,88 52,78 48,58" fill="#151921" stroke="#ffcf70" stroke-width="2"/>

    <!-- Glowing Targeting Eye -->
    <circle cx="64" cy="65" r="13" fill="url(#sensorEye)" stroke="#ffd782" stroke-width="1.5"/>
    <circle cx="64" cy="65" r="4.5" fill="#ffffff" stroke="none"/>

    <!-- Cybernetic Sensor Linework & Hardpoints -->
    <line x1="64" y1="24" x2="64" y2="40" stroke="#ffcf70" stroke-width="2"/>
    <line x1="64" y1="92" x2="64" y2="114" stroke="#ffcf70" stroke-width="2.4"/>
    <line x1="48" y1="58" x2="36" y2="58" stroke="#ffb84a" stroke-width="1.5"/>
    <line x1="80" y1="58" x2="92" y2="58" stroke="#ffb84a" stroke-width="1.5"/>
  </g>
</svg>
